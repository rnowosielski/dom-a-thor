name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish extension
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set extension version from tag
        run: node scripts/set-version-from-tag.mjs "${{ github.ref_name }}"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build extension
        run: npm run build

      - name: Package extension zip
        run: npm run package:extension

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dom-a-thor-extension.zip
          generate_release_notes: true

      - name: Publish to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISH_TARGET: ${{ vars.CHROME_PUBLISH_TARGET || 'default' }}
        run: |
          if [ -z "$CHROME_REFRESH_TOKEN" ]; then
            echo "Chrome Web Store secrets are not configured; uploaded zip to GitHub Release only."
            exit 0
          fi
          node scripts/publish-chrome-extension.mjs
